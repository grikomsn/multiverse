name: Publish

# Sends the terminal card (apps/cli) to npm as `grikomsn`, with provenance. Changesets decides:
# when main has no changeset left and the card's version is not on npm, this workflow packs the
# card and publishes it. npm trusts this file by its name (a trusted publisher), so there is no
# token. See docs/apps/cli.md.
#
# The jobs call the Changesets commands. The repository does not allow `changesets/action`:
# only the actions of GitHub and setup-bun run here.
on:
  push:
    branches: [main]
    paths:
      - .changeset/**
      - apps/cli/package.json
      - .github/workflows/publish.yml
  workflow_dispatch:

# Each job asks for what it needs.
permissions: {}

# One release at a time. A newer run waits; it does not stop one that is publishing.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # "version": changesets wait for `changeset version`, and nothing more runs here.
      # "publish": the card's version is not on npm. "none": nothing to do.
      - id: mode
        run: |
          if [ -n "$(find .changeset -name '*.md' ! -name README.md)" ]; then
            mode=version
          else
            bunx changeset publish-plan --output "$RUNNER_TEMP/publish-plan.json"
            mode=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).plan.length > 0 ? "publish" : "none"' "$RUNNER_TEMP/publish-plan.json")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode" >> "$GITHUB_STEP_SUMMARY"

  pack:
    if: needs.plan.outputs.mode == 'publish'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # A release cannot be taken back, so this job does not trust that Check passed.
      - run: bunx turbo run lint typecheck test --filter=grikomsn
      - run: bun scripts/build.ts
        working-directory: apps/cli
      # The card is one file with every package inside. Changesets packs with npm, and npm
      # cannot read the `workspace:` and `catalog:` versions of Bun, so the manifest drops them.
      - run: npm pkg delete devDependencies
        working-directory: apps/cli
      - run: bunx changeset pack --out-dir "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pack
          path: ${{ runner.temp }}/pack
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm takes GitHub's token for this run in place of a secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # This job only sends the packed file. No script of a package runs next to the token.
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pack
          path: ${{ runner.temp }}/pack
      # A trusted publisher needs npm 11.5.1 or later.
      - run: npm --version
      - run: bunx changeset publish --from-pack-dir "$RUNNER_TEMP/pack" --no-git-tag

  # The tag and the GitHub release, with the version's part of the changelog.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          awk -v version="$version" '$0 == "## " version {on = 1; next} on && /^## / {exit} on' apps/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "grikomsn@$version" --target "$GITHUB_SHA" --title "grikomsn@$version" --notes-file "$RUNNER_TEMP/notes.md"
